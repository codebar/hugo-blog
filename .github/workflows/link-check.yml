name: Link Check

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  link-checker:
    name: Link Checker
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required for actions/checkout
      issues: write  # Required for creating issues from file
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          # Check markdown files in content directory using config file
          args: --config .lychee.toml --root-dir static 'content/**/*.md'
          # Don't fail action on broken links (we'll create an issue instead)
          fail: false
          # Output format
          format: markdown
          # Output file path
          output: lychee/out.md

      - name: Create or update issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          errors_now=$(grep '^\* \[' lychee/out.md | grep -v '\[200\]' | sort)
          existing=$(gh issue list --label report --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ] && gh issue view "$existing" --json body -q .body | grep '^\* \[' | grep -v '\[200\]' | sort | diff - <(printf '%s\n' "$errors_now") >/dev/null; then
            exit 0  # same broken links as the open issue, nothing to report
          fi
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file lychee/out.md
          else
            gh issue create --title 'Link Checker Report' --body-file lychee/out.md \
              --label report --label 'automated issue'
          fi

      - name: Close stale issue
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label report --state open --json number --jq '.[0].number // empty')
          [ -z "$existing" ] || gh issue close "$existing" --comment 'All links OK.'
